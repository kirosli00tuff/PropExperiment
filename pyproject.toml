[project]
name = "propexperiment"
version = "0.1.0"
description = "Topstep XFA futures bot: offline data + rules engine (Stage A.1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "databento==0.82.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
