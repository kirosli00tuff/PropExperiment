<script>
document.addEventListener("DOMContentLoaded", function () {
  const fields = document.querySelectorAll('input[data-utm="affiliate_id"]');
  // Exit immediately if field does not exist
  if (!fields.length) return;

  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
  }

  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  let affiliateId = getQueryParam('partners') || getCookie('wp_affiliates');
  if (!affiliateId) return;

  let url = 'https://edgeclear.com/wp-admin/admin-ajax.php';

  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      action: 'get_affiliate_name',
      affiliate_id: affiliateId
    })
  })
  .then(res => res.text())
  .then(name => {
    name = name.trim();
    if (!name || name.startsWith('<')) return;

    // Populate ALL instances
    fields.forEach(field => {
      field.value = name;
    });
  });

});
</script>
	
<script>
/* Populate UTM values */
(function () {

    var UTM_FIELDS = [
        'utm_source',
        'utm_medium',
        'utm_campaign',
        'utm_content',
        'utm_term',
        'utm_id'
    ];

    function getCookie(name) {
        var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? decodeURIComponent(match[2]) : '';
    }

    function populateUTMFields() {

        UTM_FIELDS.forEach(function(param) {

            var cookieVal = getCookie(param);
            if (!cookieVal) return;

            var fields = document.querySelectorAll('[data-utm="' + param + '"]');

            fields.forEach(function(field) {
                // prevent overwriting existing values
                if (!field.value) {
                    field.value = cookieVal;
                }
            });

        });

    }

    // Initial load
    document.addEventListener('DOMContentLoaded', populateUTMFields);

    // Gravity Forms AJAX render
    document.addEventListener('gform_post_render', function() {
        populateUTMFields();
    });

})();
</script>	
<script>
(function(){

    const utmKeys = [
        'utm_source',
        'utm_medium',
        'utm_campaign',
        'utm_content',
        'utm_term',
        'utm_id'
    ];

    let params = new URLSearchParams(window.location.search);

    let hasAnyUTM = utmKeys.some(key => params.has(key));

    if (hasAnyUTM) {

        utmKeys.forEach(function(key){

            let val = params.get(key);

            if (val !== null && val !== '') {
                //console.log('SET:', key, val);
                setCookie(key, val, 3650);
            } else {
                //console.log('DELETE:', key);
                deleteCookie(key);
            }

        });

    }

})();

function setCookie(name,value,days){
	let d = new Date();
	d.setTime(d.getTime() + (days*24*60*60*1000));
	document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
}
function deleteCookie(name) {
	// Setting expires to a past date and matching the path=/ is the most reliable way
	document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;`;
}
function getCookie(name){
	let match = document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
	return match ? match[2] : "";
}

<script id="cornerstone-custom-js" type="text/javascript">
jQuery(window).on('load', function() {
  if( jQuery(".ubermenu-has-submenu-drop").length>0){
    jQuery(".ubermenu-has-submenu-drop").each(function(){
      let elem= jQuery(this);
      elem.addClass("aria_pop");
      elem.find(">a").attr("aria-haspopup", "true").attr("aria-expanded","false");
    })

    jQuery(".ubermenu-nav").on( 'focus.aria mouseenter.aria', '.aria_pop', function () {
      let elem= jQuery(this);
      elem.find(">a").attr("aria-expanded", "true");
    });

    jQuery(".ubermenu-nav").on( 'blur.aria mouseleave.aria', '.aria_pop', function () {
      let elem= jQuery(this);
      elem.find(">a").attr("aria-expanded", "false");
    });
  }
})
</script>
